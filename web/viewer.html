<!doctype html>
<!--
PDF.js Viewer - Customized for Digital Theological Library (DTL)
Based on Mozilla PDF.js (Apache 2.0 License)

Security Features:
- Chapter/page restrictions via signed tokens
- DevTools detection with friendly messaging
- Disabled easy PDF extraction methods
- Keyboard shortcut blocking for save/print
-->
<html dir="ltr" mozdisallowselectionprint>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="google" content="notranslate" />
    <title>PDF.js viewer</title>

    <!-- DTL: EARLY CHECKS & CONFIGURATION -->
    <script>
      (function () {
        // =============================================================
        // HELPERS
        // =============================================================
        function decodeToken(token) {
          if (!token) return null;
          try {
            const parts = token.split('.');
            if (parts.length < 2) return null;
            const payloadPart = parts.length === 3 ? parts[1] : parts[0];
            let base64 = payloadPart.replace(/-/g, '+').replace(/_/g, '/');
            while (base64.length % 4) base64 += '=';
            
            const binString = atob(base64);
            const bytes = new Uint8Array(binString.length);
            for (let i = 0; i < binString.length; i++) bytes[i] = binString.charCodeAt(i);
            return JSON.parse(new TextDecoder().decode(bytes));
          } catch (e) { return null; }
        }

        function extractTokenFromFile(fileParam) {
          if (!fileParam) return null;
          try {
            const decoded = decodeURIComponent(fileParam);
            return new URL(decoded, location.href).searchParams.get("token");
          } catch {
            try { return new URL(fileParam, location.href).searchParams.get("token"); } 
            catch { return null; }
          }
        }

        // =============================================================
        // PARSE & STORE CONFIGURATION
        // =============================================================
        const p = new URLSearchParams(location.search);
        let token = p.get('token');
        const fileParam = p.get('file');
        
        if (!token && fileParam) token = extractTokenFromFile(fileParam);

        let config = {
            allowDownload: false,
            chapterStart: null,
            chapterEnd: null,
            chapterName: null,
            pageLimit: 100,
            isChapterMode: false,
            isLegacy: false
        };

        if (token) {
            const payload = decodeToken(token);
            if (payload) {
                config.chapterStart = payload.s || null;
                config.chapterEnd = payload.e || null;
                config.chapterName = payload.c || null;
                config.allowDownload = payload.d === 1;
                config.isChapterMode = (config.chapterStart !== null && config.chapterEnd !== null);
            }
        } else {
            // Legacy Mode (Localhost Only - for development)
            const isLocal = ['localhost', '127.0.0.1'].includes(location.hostname);
            if (isLocal) {
                config.isLegacy = true;
                config.pageLimit = parseInt(p.get('limit'), 10) || 100;
                config.allowDownload = p.get('download') === 'true';
                config.chapterStart = parseInt(p.get('start'), 10) || null;
                config.chapterEnd = parseInt(p.get('end'), 10) || null;
                config.chapterName = p.get('chapter') ? decodeURIComponent(p.get('chapter')) : null;
                config.isChapterMode = (config.chapterStart !== null && config.chapterEnd !== null);
            }
        }

        // Store for main script
        window.DTL_CONFIG = config;

        // =============================================================
        // CSS GATE (Immediate UI Hiding)
        // =============================================================
        document.documentElement.classList.toggle('dtl-allow-download', config.allowDownload);

        // =============================================================
        // REFERRER CHECK (Soft Signal - Worker has hard security)
        // =============================================================
        const referrer = document.referrer;
        function isHostAllowed(ref) {
            if (!ref) return true; 
            try {
                const h = new URL(ref).hostname;
                const allowed = ['thedtl.org', 'thedtl.github.io', 'libguides.com', 'libapps.com', 'springshare.com', 'oclc.org', 'localhost', '127.0.0.1'];
                return allowed.some(d => h === d || h.endsWith('.' + d));
            } catch { return true; }
        }

        if (referrer && !isHostAllowed(referrer)) {
            window.stop();
            document.documentElement.innerHTML = createErrorPage(
                '🔗',
                'Invalid Link Source',
                'This resource must be accessed through the library website.'
            );
            throw new Error("Access Denied: Invalid Referrer");
        }

        // =============================================================
        // ERROR PAGE GENERATOR (Used throughout)
        // =============================================================
        function createErrorPage(icon, title, message) {
            return `
            <head>
                <title>${title} | Digital Theological Library</title>
                <meta name="viewport" content="width=device-width, initial-scale=1">
                <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
                <style>
                    * { box-sizing: border-box; margin: 0; padding: 0; }
                    body {
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        min-height: 100vh;
                        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                        background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
                        padding: 20px;
                    }
                    .card {
                        background: white;
                        padding: 48px 40px;
                        border-radius: 16px;
                        box-shadow: 0 10px 40px rgba(0,0,0,0.1);
                        text-align: center;
                        max-width: 420px;
                        width: 100%;
                    }
                    .icon { font-size: 56px; margin-bottom: 20px; }
                    h1 { margin: 0 0 12px 0; color: #1f2937; font-size: 24px; font-weight: 700; }
                    .message { color: #6b7280; margin: 0 0 28px 0; line-height: 1.6; }
                    .catalog-prompt { color: #6b7280; margin: 0 0 16px 0; font-size: 14px; }
                    .links { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
                    .btn {
                        display: block;
                        padding: 14px 24px;
                        color: white;
                        text-decoration: none;
                        border-radius: 8px;
                        font-weight: 600;
                        text-align: center;
                        transition: opacity 0.2s;
                    }
                    .btn:hover { opacity: 0.9; }
                    .btn-primary { background: #0061fe; }
                    .btn-secondary { background: #10b981; }
                    .help { font-size: 13px; color: #9ca3af; }
                </style>
            </head>
            <body>
                <div class="card">
                    <div class="icon">${icon}</div>
                    <h1>${title}</h1>
                    <p class="message">${message}</p>
                    <p class="catalog-prompt">Return to our catalog to find and access resources:</p>
                    <div class="links">
                        <a href="https://libguides.thedtl.org/home" class="btn btn-primary">📖 DTL Catalog</a>
                        <a href="https://dtl2.libguides.com/home" class="btn btn-secondary">📚 DTL2 Catalog</a>
                    </div>
                    <p class="help">Need help? Contact your librarian for assistance.</p>
                </div>
            </body>`;
        }

        // Make available globally
        window.DTL_createErrorPage = createErrorPage;
      })();
    </script>

        <dialog id="printServiceDialog" style="min-width: 200px">

            <span data-l10n-id="pdfjs-print-progress-message"></span>
          </div>
          <div class="row">
            <progress value="0" max="100"></progress>
            <span data-l10n-id="pdfjs-print-progress-percent" data-l10n-args='{ "progress": 0 }' class="relative-progress">0%</span>
          </div>

    <!-- =============================================================
         DTL SECURITY & RESTRICTIONS SCRIPT
         ============================================================= -->
    <script>
    (function() {
        'use strict';

        // =============================================================
        // SESSION PAGE (Friendly Full-Page Message)
        // =============================================================
        function showSessionPage(icon, title, message) {
            // Close PDF if loaded
            if (window.PDFViewerApplication && window.PDFViewerApplication.pdfDocument) {
                try { window.PDFViewerApplication.close(); } catch(e) {}
            }
            
            document.documentElement.innerHTML = window.DTL_createErrorPage(icon, title, message);
        }

        // =============================================================
        // DEVTOOLS DETECTION (Friendly)
        // =============================================================
        (function() {
            const threshold = 160;
            let triggered = false;
            
            const checkDevTools = () => {
                if (triggered) return;
                
                const widthThreshold = window.outerWidth - window.innerWidth > threshold;
                const heightThreshold = window.outerHeight - window.innerHeight > threshold;
                
                if (widthThreshold || heightThreshold) {
                    triggered = true;
                    showSessionPage(
                        '🔐',
                        'Viewing Session Ended',
                        'For content protection, this viewing session has closed. This is not an error—just a security feature to protect library resources.'
                    );
                }
            };
            
            // Check periodically and on resize
            setInterval(checkDevTools, 1000);
            window.addEventListener('resize', checkDevTools);
        })();

        // =============================================================
        // KEYBOARD SHORTCUT BLOCKING
        // =============================================================
        if (!window.DTL_CONFIG.allowDownload) {
            document.addEventListener('keydown', function(e) {
                // Block Ctrl/Cmd + S (Save), P (Print), O (Open), U (View Source)
                if ((e.ctrlKey || e.metaKey) && ['s', 'p', 'o', 'u'].includes(e.key.toLowerCase())) {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }
                // Block F12 (DevTools)
                if (e.key === 'F12') {
                    e.preventDefault();
                    return false;
                }
                // Block Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C (DevTools variations)
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i', 'j', 'c'].includes(e.key.toLowerCase())) {
                    e.preventDefault();
                    return false;
                }
            }, true);
            
            // Block right-click context menu
            document.addEventListener('contextmenu', e => e.preventDefault());
        }

        // =============================================================
        // HIDE EDITOR TOOLS
        // =============================================================
        const hideEditorTools = () => {
            const editorSelectors = [
                '#editorModeButtons', '#editorModeSeparator', '#editorHighlight',
                '#editorFreeText', '#editorInk', '#editorStamp',
                '#editorComment', '#editorSignature'
            ];
            editorSelectors.forEach(sel => {
                const el = document.querySelector(sel);
                if (el) el.style.display = 'none';
            });
        };

        // =============================================================
        // END OF CHAPTER/PREVIEW CARD (Friendly)
        // =============================================================
        let endCardShowing = false;
        
        const showEndCard = (isChapter, reason) => {
            if (endCardShowing || document.getElementById('dtl-preview-end-card')) return;
            endCardShowing = true;
            
            const r = window.DTL_CONFIG;
            let titleText, messageText, pageInfoText;
            
            if (isChapter) {
                if (reason === 'start') {
                    titleText = 'Start of Chapter';
                    messageText = 'You are at the beginning of this chapter.';
                } else {
                    titleText = 'End of Chapter';
                    messageText = r.chapterName 
                        ? `You've reached the end of "${r.chapterName}".`
                        : 'You\'ve reached the end of this chapter.';
                }
                pageInfoText = `Pages ${r.chapterStart}–${r.chapterEnd} of ${r.totalPages}`;
            } else {
                titleText = 'Preview Complete';
                messageText = `You've reached the end of this ${r.pageLimit}% preview.`;
                pageInfoText = `Page ${r.maxPage} of ${r.totalPages}`;
            }
            
            const endCard = document.createElement('div');
            endCard.id = 'dtl-preview-end-card';
            endCard.innerHTML = `
                <div style="
                    position: fixed; inset: 0;
                    background: rgba(0,0,0,0.85);
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    z-index: 99999;
                    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                    padding: 20px;
                    box-sizing: border-box;
                ">
                    <div style="
                        background: white;
                        padding: 40px;
                        border-radius: 16px;
                        text-align: center;
                        max-width: 480px;
                        width: 100%;
                        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
                    ">
                        <div style="font-size: 48px; margin-bottom: 16px;">📖</div>
                        <h2 style="margin: 0 0 12px 0; color: #333; font-size: 24px;">${titleText}</h2>
                        <p style="color: #666; margin: 0 0 16px 0; line-height: 1.6;">${messageText}</p>
                        <div style="
                            background: #f5f5f5;
                            padding: 12px 20px;
                            border-radius: 8px;
                            color: #888;
                            font-size: 14px;
                            margin-bottom: 24px;
                        ">${pageInfoText}</div>
                        
                        <button id="dtl-end-card-close" style="
                            padding: 12px 28px;
                            background: #0061fe;
                            color: white;
                            border: none;
                            border-radius: 8px;
                            font-size: 14px;
                            font-weight: 600;
                            cursor: pointer;
                            margin-bottom: 20px;
                            width: 100%;
                        ">Continue Reading</button>
                        
                        <div style="
                            border-top: 1px solid #eee;
                            padding-top: 20px;
                            margin-top: 4px;
                        ">
                            <p style="color: #888; font-size: 13px; margin-bottom: 12px;">
                                Looking for more? Browse our catalogs:
                            </p>
                            <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
                                <a href="https://libguides.thedtl.org/home" target="_blank" style="
                                    color: #0061fe;
                                    text-decoration: none;
                                    font-size: 14px;
                                    font-weight: 500;
                                ">📖 DTL Catalog</a>
                                <a href="https://dtl2.libguides.com/home" target="_blank" style="
                                    color: #10b981;
                                    text-decoration: none;
                                    font-size: 14px;
                                    font-weight: 500;
                                ">📚 DTL2 Catalog</a>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            document.body.appendChild(endCard);
            document.getElementById('dtl-end-card-close').onclick = () => {
                endCard.remove();
                endCardShowing = false;
            };
        };

        // =============================================================
        // MAIN SETUP: PDF.js Lifecycle Hooks
        // =============================================================
        function setupRestrictions() {
            const app = window.PDFViewerApplication;
            if (!app || !app.initializedPromise) return;

            app.initializedPromise.then(() => {
                const pdfDoc = app.pdfDocument;
                if (!pdfDoc) return;

                hideEditorTools();
                
                // =============================================================
                // NEUTER EASY EXTRACTION METHODS
                // =============================================================
                try {
                    pdfDoc.getData = () => Promise.reject(new Error('Access denied'));
                    pdfDoc.saveDocument = () => Promise.reject(new Error('Access denied'));
                    if (pdfDoc.getDownloadInfo) {
                        pdfDoc.getDownloadInfo = () => Promise.reject(new Error('Access denied'));
                    }
                } catch (e) {
                    // Some methods might be read-only
                }

                const totalPages = pdfDoc.numPages;
                const r = window.DTL_CONFIG;
                r.totalPages = totalPages;

                const numPagesEl = document.getElementById('numPages');
                
                // Show page count if no restrictions
                if (numPagesEl && !r.isChapterMode && r.pageLimit === 100) {
                    numPagesEl.style.visibility = 'visible';
                }

                // =============================================================
                // CHAPTER MODE
                // =============================================================
                if (r.isChapterMode) {
                    const validStart = Math.max(1, Math.min(r.chapterStart, totalPages));
                    const validEnd = Math.max(validStart, Math.min(r.chapterEnd, totalPages));
                    r.chapterStart = validStart;
                    r.chapterEnd = validEnd;
                    r.chapterLength = validEnd - validStart + 1;

                    // Jump to chapter start
                    app.page = validStart;

                    // Page Display Logic
                    const pageInput = document.getElementById('pageNumber');
                    let isUserEditing = false;

                    if (pageInput) {
                        pageInput.addEventListener('focus', () => { isUserEditing = true; });
                        pageInput.addEventListener('blur', () => { isUserEditing = false; });
                    }

                    const updatePageDisplay = (currentPage) => {
                        if (isUserEditing) return;
                        const relPage = currentPage - validStart + 1;
                        
                        if (pageInput) {
                            pageInput.value = relPage;
                            pageInput.max = r.chapterLength;
                            pageInput.min = 1;
                        }
                        if (numPagesEl) {
                            numPagesEl.textContent = `of ${r.chapterLength}`;
                            numPagesEl.style.visibility = 'visible';
                        }
                    };
                    updatePageDisplay(validStart);

                    // Navigation Guard
                    app.eventBus.on('pagechanging', function(evt) {
                        const page = evt.pageNumber;
                        if (page < validStart) {
                            setTimeout(() => { 
                                app.page = validStart; 
                                updatePageDisplay(validStart);
                            }, 0);
                            showEndCard(true, 'start');
                        } else if (page > validEnd) {
                            setTimeout(() => { 
                                app.page = validEnd; 
                                updatePageDisplay(validEnd);
                            }, 0);
                            showEndCard(true, 'end');
                        } else {
                            updatePageDisplay(page);
                        }
                    });

                    // Input Handling
                    if (pageInput) {
                        pageInput.addEventListener('change', function(e) {
                            e.stopPropagation();
                            const relPage = parseInt(this.value, 10);
                            if (isNaN(relPage) || relPage < 1) {
                                app.page = validStart;
                            } else if (relPage > r.chapterLength) {
                                app.page = validEnd;
                                showEndCard(true, 'end');
                            } else {
                                app.page = validStart + relPage - 1;
                            }
                        }, true);
                        
                        pageInput.addEventListener('keydown', function(e) {
                            if (e.key === 'Enter') {
                                e.preventDefault();
                                e.stopPropagation();
                                this.dispatchEvent(new Event('change'));
                                this.blur(); 
                            }
                        }, true);
                    }

                    // Thumbnail Hiding (Defense in Depth)
                    const thumbnailView = document.getElementById('thumbnailView');
                    if (thumbnailView) {
                        const hideNode = (node) => {
                            const pageNum = parseInt(node.getAttribute('data-page-number'), 10);
                            if (pageNum < validStart || pageNum > validEnd) node.style.display = 'none';
                        };

                        thumbnailView.querySelectorAll('.thumbnail').forEach(hideNode);

                        new MutationObserver((mutations) => {
                            mutations.forEach((m) => {
                                m.addedNodes.forEach((n) => {
                                    if (n.nodeType === 1 && n.classList.contains('thumbnail')) hideNode(n);
                                });
                            });
                        }).observe(thumbnailView, { childList: true, subtree: true });
                    }

                // =============================================================
                // PERCENTAGE MODE
                // =============================================================
                } else if (r.pageLimit < 100) {
                    const maxPage = Math.max(1, Math.floor(totalPages * (r.pageLimit / 100)));
                    r.maxPage = maxPage;

                    app.eventBus.on('pagechanging', function(evt) {
                        if (evt.pageNumber > maxPage) {
                            setTimeout(() => { app.page = maxPage; }, 0);
                            showEndCard(false, 'end');
                        }
                    });

                    const pageInput = document.getElementById('pageNumber');
                    if (pageInput) {
                        pageInput.max = maxPage;
                        pageInput.addEventListener('change', function() {
                            if (parseInt(this.value, 10) > maxPage) {
                                this.value = maxPage;
                                app.page = maxPage;
                                showEndCard(false, 'end');
                            }
                        });
                    }

                    if (numPagesEl) {
                        numPagesEl.textContent = `of ${maxPage}`;
                        numPagesEl.style.visibility = 'visible';
                    }
                }
            });
        }

        // Hook into PDF.js loading process
        document.addEventListener('webviewerloaded', setupRestrictions, { once: true });
        setupRestrictions();

        // =============================================================
        // HISTORY MANAGEMENT (Handle bfcache)
        // =============================================================
        window.addEventListener("pageshow", function (event) {
            if (event.persisted) {
                history.replaceState(null, "", location.href);
            }
        });

    })();
    </script>
  </body>
